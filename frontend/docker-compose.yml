services:
  expo: #expo is our service name in docker compose. expo-app is the container name in docker. -edd
    build: .
    container_name: expo-app
    ports:
      - "19000:19000"  # Expo Dev Tools
      - "19001:19001"  # Expo Dev Server (iOS)
      - "19002:19002"  # Expo Dev Server (Android)
      - "8082:8081"    # Metro Bundler changed from 8081 to 8082 to avoid conflict with other services -edd
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=localhost
      - NODE_ENV=development
    stdin_open: true
    tty: true
    restart: unless-stopped